      description: 'Each tactic''s `incident_count` is the number of distinct non-closed incidents mapped to that tactic in the selected period. Each technique''s `incident_count` is the number of distinct incidents mapped to that technique (subtechniques roll up to their parent technique).


        The sum of per-technique counts under a tactic may differ from the tactic-level count: an incident typically maps to several techniques within the same tactic, so it is counted once at the tactic level but once per technique it maps to at the technique level. Clients should use the tactic-level count for tactic totals, not a sum over techniques.'
      security:
