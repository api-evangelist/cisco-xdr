      tags:
      - Report
      summary: Team mean time to resolve over the period
      description: 'Returns `{current_avg, prior_avg}` in seconds, averaged over incidents in the requesting org created during the selected period (`current_avg`) and during the immediately-preceding window of the same size (`prior_avg`). Each value is the rounded mean of `(closed - opened)` in seconds, where `opened` is the timestamp the incident was first set to a non-`New` status (incidents created already at a non-`New` status contribute a near-zero `(opened - created_at)` and a real `(closed - opened)` once they close). Never-closed incidents are excluded (the delta is undefined). Rows where `closed < opened` (CTIA/distributor clock skew, backfilled imports) are also excluded. A window with no qualifying incidents yields `null`. Clients compute the delta to render period-over-period.


        Window bucketing matches the engage tile: incidents are filtered by `created_at` within the period, then their `(closed - opened)` is averaged. Long-tail incidents that haven''t closed yet by query time aren''t included in the average — a survivorship bias accepted in exchange for cross-tile consistency.'
      security:
      - JWT-Bearer: []
      - oauth2: []
      operationId: getV2ReportTeamMeanTimeToResolve
      x-operation-id-source: derived
