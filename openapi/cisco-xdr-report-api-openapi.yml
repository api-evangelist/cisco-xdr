        An incident tagged with multiple detection sources on the same day contributes 1 to each source''s bucket on that day; the sum of per-source counts is therefore ≥ the total incident count for the period.


        Empty `(source, day)` pairs are omitted from the response — clients that need zero-filled time series should reshape on their end.'
