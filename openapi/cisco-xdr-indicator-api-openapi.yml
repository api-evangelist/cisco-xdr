          format: date-time
        confidence:
          example: High
          description: level of confidence held in the accuracy of this Indicator.
          type: string
          enum:
          - Medium
          - Info
          - Unknown
          - None
          - High
          - Low
        specification:
          example: anything
          description: Simplified conditional branch
