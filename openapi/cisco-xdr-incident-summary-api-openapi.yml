            private-intel:read: Read data from private intel. Needed to get investigation data.
            private-intel: Full private intel integration scope.
            asset: Get Data from Device Insights. Needed during running investigations.
            enrich:read: Fetch Data about observables. Needed for investigations.
            integration:read: Get module information. Needed to create a new investigation.
            investigation: Run investigations. Needed for investigations.
            casebook: Full casebook management access. Allows read, write to casebooks.
            casebook:read: Read Casebook access
            global-intel:read: Read data from public intel. Needed to fetch global incident data and investigations.
            private-intel:write: Private intel write scope.
            ao: Execute and read workflows
            playbook:read: Get playbook state. Needed to get full report information.
