components:
  schemas:
    PartialEvent:
      type: object
      properties:
        fields:
          type: array
          items:
            $ref: '#/components/schemas/Update'
        type:
          type: string
          enum:
          - event
        id:
          type: string
        tlp:
          example: green
          type: string
          enum:
          - white
          - green
          - red
          - amber
        event_type:
          type: string
          enum:
          - record-created
          - record-deleted
          - record-updated
        groups:
          type: array
          items:
            type: string
        timestamp:
          type: string
          format: date-time
        entity:
          $ref: '#/components/schemas/Response116834EventsEntity'
        owner:
          type: string
      additionalProperties: false
    Update:
      type: object
      properties:
        field:
          type: string
        action:
          type: string
          enum:
          - added
          - deleted
          - modified
        change:
          $ref: '#/components/schemas/Response116834EventsFieldsChange'
      additionalProperties: false
      required:
      - field
      - action
      - change
    Response116834EventsFieldsChange:
      type: object
      properties:
        before: {}
        after: {}
      additionalProperties: false
    Response116834EventsEntity:
      type: object
      additionalProperties: {}
    EventBucket:
      type: object
      properties:
        count:
          type: integer
          format: int64
        from:
          type: string
          format: date-time
        to:
          type: string
          format: date-time
        owner:
          type: string
        events:
          type: array
          items:
            $ref: '#/components/schemas/PartialEvent'
      additionalProperties: false
      required:
      - count
      - from
      - to
      - owner
      - events
    UpdatedField:
      type: object
      properties:
        field:
          type: string
        action:
          type: string
          enum:
          - added
          - deleted
          - modified
        value:
          $ref: '#/components/schemas/EventDataUpdatedFieldsValue'
      additionalProperties: false
      required:
      - field
      - action
      - value
    EntitlementData:
      type: object
      properties:
        event_type:
          type: string
          enum:
          - entitlements/updated
        org_id:
          type: string
      additionalProperties: false
      required:
      - event_type
      - org_id
    SCIMInfos:
      type: object
      properties:
        id:
          type: string
        access-token:
          type: string
        group-id:
          type: string
      additionalProperties: {}
      required:
      - id
      - access-token
      - group-id
    EventEmiter:
      type: object
      properties:
        user_id:
          type: string
        org_id:
          type: string
        client_id:
          type: string
      additionalProperties: false
      required:
      - user_id
      - org_id
    ModuleInstanceEventData:
      type: object
      properties:
        event_type:
          type: string
          enum:
          - module-instance/restricted
          - module-instance/reactivated
          - module-instance/updated
          - module-instance/created
          - module-instance/deleted
        module_instance_id:
          type: string
        module_type_id:
          type: string
        module_instance_visibility:
          type: string
          enum:
          - global
          - org
          - user
        state_changed?:
          type: boolean
      additionalProperties: false
      required:
      - event_type
      - module_instance_id
      - module_type_id
      - module_instance_visibility
    UserEventData:
      type: object
      properties:
        user_id:
          type: string
        new_user:
          $ref: '#/components/schemas/User'
        old_user:
          $ref: '#/components/schemas/User'
        event_type:
          type: string
          enum:
          - user/updated
          - user/deleted
          - user/created
      additionalProperties: false
      required:
