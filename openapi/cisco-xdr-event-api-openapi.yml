        schema_version:
          example: 1.3.30
          description: CTIM schema version for this entity.
          type: string
        revision:
          example: 10
          description: A monotonically increasing revision, incremented each time the object is changed.
          type: integer
          format: int64
        type:
          example: incident
          type: string
          enum:
          - incident
        created:
          type: string
          format: date-time
        source:
          example: string
          description: Represents the source of the intelligence that led to the creation of the entity.
          type: string
        external_ids:
          example:
          - string
          description: "It is used to store a list of external identifiers that can be linked to the incident, providing a\
            \ reliable and manageable way to correlate and group related events across multiple data sources. It is especially\
            \ useful in larger organizations that rely on multiple security information and event management (SIEM) systems\
            \ to detect security incidents. For instance, it can be used to track events across different network sensors,\
            \ intrusion detection and prevention systems (IDPS), or log management platforms. \n The field can also be used\
            \ to facilitate automation and orchestration workflows, where additional information can be shared among incident\
            \ management systems. It can be used to cross-reference with other external tools such as threat intelligence\
            \ feeds and vulnerability scanners."
          type: array
          items:
            type: string
        modified:
          type: string
          format: date-time
        short_description:
          example: string
          description: A single line, short summary of the object.
          type: string
        title:
          example: string
          description: A short title for this object, used as primary display and reference value.
          type: string
        incident_time:
          $ref: '#/components/schemas/IncidentTime'
        external_references:
          example:
          - source_name: string
            description: string
            url: string
            hashes:
            - string
            external_id: string
          description: "Specifies a list of external references which refers to non-CTIM information.\n\nSimilar to `external_ids`\
            \ field with major differences:\n\n- `external_ids` field is used to store a list of external identifiers that\
            \ can be used to link entities across different data sources. These identifiers are typically standardized and\
            \ well-known, such as CVE IDs, US-CERT advisories, or other industry-standard threat intelligence feeds. The `external_ids`\
            \ field can be used to facilitate automation and orchestration workflows, where additional information can be\
            \ shared among incident management systems. \n\n- `external_references` field, on the other hand, is used to provide\
            \ a more general mechanism for linking entities to external sources of information. The `external_references`\
            \ field can include references to blog posts, articles, external documents, threat intelligence reports, and other\
            \ sources of information that may not have a standardized format or identifier."
          type: array
          items:
            $ref: '#/components/schemas/ExternalReference'
        discovery_method:
          example: Agent Disclosure
          description: Identifies how the incident was discovered.
          type: string
        source_uri:
          example: string
          description: URI of the source of the intelligence that led to the creation of the entity.
          type: string
        intended_effect:
          example: Account Takeover
          description: Specifies the suspected intended effect of this incident
          type: string
        categories:
          example:
          - Attrition
          description: A set of categories for this incident.
          type: array
          items:
            type: string
        status:
          example: Closed
          description: The `status` field represents the current state of an incident within the incident management process.
            Its values help in tracking and reporting the progress of the incident from its discovery to its resolution.
          type: string
          enum:
          - New
          - Closed
          - 'Open: Recovered'
          - 'Closed: Other'
          - 'Hold: Internal'
          - 'Hold: Legal'
          - 'Closed: Under Review'
          - Rejected
          - Open
          - 'Closed: Merged'
          - Restoration Achieved
          - Incident Reported
          - 'Closed: Suspected'
          - Stalled
          - 'Open: Contained'
          - 'Closed: Near-Miss'
          - 'Hold: External'
          - Containment Achieved
          - 'New: Processing'
          - 'Closed: Confirmed Threat'
          - 'Closed: False Positive'
          - 'Open: Reported'
          - 'Open: Investigating'
          - Hold
          - 'New: Presented'
        language:
          example: string
          description: 'The `language` field is used to specify the primary language of the affected system or the target
            of an attack. It can be used to provide additional context and information about the entity. The primary purpose
            of this field is to help analysts filter and prioritize entities based on their knowledge and expertise of different
            languages.


            For example, if an incident involves an attack on a system in a country where a specific language is predominant,
            the `language` field can be used to indicate that language, which can help analysts to quickly identify and respond
            to incidents that may be geographically or culturally relevant. This information can be used to prioritize incidents
            based on their potential impact. The `language` field can also be used to help with correlation of incidents across
            different systems and regions, as well as to help with data analysis and reporting.'
          type: string
        detection_status:
          example: active
          description: Represents the state of an incident within the incident generation process, indicating whether the
            incident is actively receiving updates or is no longer being updated.
          type: string
          enum:
          - inactive_oversized
          - inactive_user_closed
          - active
          - inactive_merged
          - inactive_expired
        id:
          example: string
          description: Globally unique URI identifying this object.
          type: string
        promotion_method:
          example: Automated
          description: Describes method for promoting an Incident, whether manually or automatically. An Incident may be created
            manually by a SOAR analyst or SOC operator, or through an automated correlation or aggregation rule or engine
            that matches a specific set of events or alerts, and promotes them to Incident(s).
          type: string
          enum:
          - Automated
          - Manual
        severity:
          example: Critical
          description: "Represents the potential impact of an incident on an organization's security posture and business\
            \ operations. It helps organizations prioritize and allocate resources for incident response based on the severity\
            \ level of the incident \nIt helps analysts and incident handlers prioritize incidents by indicating the level\
            \ of risk and potential impact associated with the incident. This enables organizations to allocate resources\
            \ efficiently and address the most critical incidents first.\nCan also be used to generate reports and metrics\
            \ for measuring the effectiveness of the incident response process and to identify trends and patterns in the\
            \ threat landscape.\nIt is important to note that the `severity` field is subjective and can be interpreted differently\
            \ by different organizations or analysts. Therefore, it should be used in conjunction with other intelligence\
            \ attributes, such as the `confidence` field, to provide a more comprehensive view of the incident."
          type: string
          enum:
          - Medium
          - Info
          - Unknown
          - None
          - High
          - Critical
          - Low
        tlp:
          example: green
          description: 'TLP stands for [Traffic Light Protocol](https://www.us-cert.gov/tlp), which indicates precisely how
            a resource is intended to be shared, replicated, copied, etc.


            It is used to indicate the sensitivity of the information contained within the message. This allows recipients
            to determine the appropriate handling and dissemination of the information based on their clearance level and
            need-to-know.


            For example, an entity containing information about a critical vulnerability in a widely-used software might be
            marked as `red`, indicating that it should only be shared with a small group of highly trusted individuals who
            need to know in order to take appropriate action. On the other hand, a message containing more general information
            about security threats might be marked as `amber` or `green`, indicating that it can be shared more broadly within
            an organization.'
          type: string
          enum:
          - white
          - green
          - red
          - amber
        scores:
          $ref: '#/components/schemas/IncidentScores'
        client_id:
          type: string
        techniques:
          example:
          - string
          description: Represents the specific methods or actions used by an attacker to carry out an offensive maneuver or
            achieve their goals.
          type: array
          items:
            type: string
        timestamp:
          example: '2016-01-01T01:01:01.000Z'
          description: The time this object was created at, or last modified.
          type: string
          format: date-time
        confidence:
          example: High
          description: 'Represents the level of certainty or trustworthiness associated with the incident. It denotes the
            reliability of the intelligence associated with the incident.

            The `confidence` field can take on several values, including:

            - `info`: Indicates that the incident information is based on sources with no previous track record or there is
            no track record for the source reporting the incident.

            - `low`: Indicates that the incident information is based on sources with a questionable track record or there
            is limited information about the accuracy of the source.

            - `medium`: Indicates that the incident information is based on sources with a mixed track record or of uncertain
            reliability.

            - `high`: Indicates that the incident information is based on sources with a proven track record and high degree
            of reliability.

            The `confidence` field can be used to indicate the level of trust and confidence that can be attributed to the
            incident, and it may impact how the incident is prioritized, analyzed and addressed. It can also help in the decision-making
            process associated with the incident response activities.

            It is important to note that the `confidence` field is subjective and can be interpreted differently by different
            organizations or analysts. As such, it is often used in conjunction with other intelligence attributes, such as
            the `severity` field, to provide a more complete picture of the incident.'
          type: string
          enum:
          - Medium
          - Info
          - Unknown
          - None
          - High
          - Low
        short_id:
          example: string
          description: A human-readable, short identifier for the incident, unique within an organization.
          type: string
        tactics:
          example:
          - string
          description: Represents the offensive techniques, approaches, or procedures that an adversary may use to achieve
            their objectives during an attack. It helps in understanding the intent and capabilities of the adversary and
            can be used to identify indicators of attack (IoAs) or indicators of compromise (IoCs) that are associated with
            the adversary's tactics.
          type: array
          items:
            type: string
      additionalProperties: false
      required:
      - schema_version
      - type
      - incident_time
      - status
      - id
      - confidence
