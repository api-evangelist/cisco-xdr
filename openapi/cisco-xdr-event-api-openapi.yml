          \ the following score types:\n\n- `asset` - assesses the potential damage or harm that the threat can cause to the\
          \ affected asset(s). The scale ranges from 0 to 10, with 10 indicating the highest potential harm. \n\n- `global`\
          \ - assesses the overall impact or significance of the threat to the organization or wider community. The scale\
          \ ranges from 0 to 1000, with 1000 indicating the highest impact.\n\n- `ttp` - a measure of the threat actor's proficiency\
          \ in utilizing TTPs. Typically, ranges from 0-100, with a higher score indicating a greater threat or concern."
