tags:
- name: Tasks
paths:
  /v1/tasks:
    get:
      tags:
      - Tasks
      summary: Handler to get all tasks.
      description: 'Allowed Role(s): admin, user, sat'
      operationId: getAllTasksQueryParam
      parameters:
      - name: owner
        in: query
        description: Comma separated list of owner IDs to filter by
        schema:
          type: string
          x-go-name: Owner
        x-go-name: Owner
      - name: search
        in: query
        description: Comma separated list of search terms to filter based on task display names, and task response
        schema:
          type: string
          x-go-name: Search
        x-go-name: Search
      - name: state
        in: query
        description: Comma separated list of task states to filter
        schema:
          type: string
          x-go-name: State
        x-go-name: State
      - name: limit
        in: query
        description: Number of tasks to return for this request
        schema:
          type: integer
          format: int64
          x-go-name: Limit
        x-go-name: Limit
      - name: start
        in: query
        description: Return list of tasks from n'th task, n is start to be provided
        schema:
          type: integer
          format: int64
          x-go-name: Start
        x-go-name: Start
      - name: sort_by
        in: query
        description: Comma separated list of task priorities to filter
        schema:
          type: string
          x-go-name: Priority
        x-go-name: Priority
      - name: due_date
        in: query
        description: filter tasks based on due date, an valid date will be 2019-05-15T12:00:00Z
        schema:
          type: string
          x-go-name: DueDate
        x-go-name: DueDate
      - name: requestor
        in: query
        description: Comma separated list of task requestors to filter
        schema:
          type: string
          x-go-name: Requestor
        x-go-name: Requestor
      - name: assignees
        in: query
        description: Comma separated list of task assignees to filter
        schema:
          type: string
          x-go-name: Assignees
        x-go-name: Assignees
      - name: response
        in: query
        description: Comma separated list of responses that assignees has responded
        schema:
          type: string
          x-go-name: Response
        x-go-name: Response
      - name: type
        in: query
        description: Filter based on type of task
        schema:
          type: string
          x-go-name: TaskType
        x-go-name: TaskType
      responses:
        '200':
          description: An GetAllTasksSwaggerResponse model.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetAllTasksResponse'
        '400':
          description: A Error is a swagger response to represent error
          headers:
            code:
              schema:
                type: integer
                format: int64
            description:
              schema:
                type: string
            message:
              schema:
                type: string
          content: {}
        '403':
          description: A Error is a swagger response to represent error
          headers:
            code:
              schema:
                type: integer
                format: int64
            description:
              schema:
                type: string
            message:
              schema:
                type: string
          content: {}
        '404':
          description: A Error is a swagger response to represent error
          headers:
            code:
              schema:
                type: integer
                format: int64
