  /v1/tasks/summary:
    get:
      tags:
      - Tasks
      summary: Handler to get a summary of tasks.
      description: 'Including total number of tasks, not completed, due soon, overdue, expired and assigned to the user.

        Allowed Role(s): admin, user, sat

        Allowed User(s): Who have atleast VIEW permission to given task'
      operationId: listTaskSummary
      responses:
        '200':
          description: 'An GetTasksSummaryResponse model.


