      description: Allows to gather and group observables and related analyst notes in one place from across multiple products for easy retrieval and further actions. Through Casebook, analysts can collaborate, share information, track progress, and take necessary actions to mitigate the incident.
      type: object
      properties:
        description:
          example: string
          description: A description of object, which may be detailed.
          type: string
        authorized_groups:
          type: array
          items:
            type: string
        schema_version:
          type: string
