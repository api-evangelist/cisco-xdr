      description: 'A Note is intended to convey informative text to provide further context and/or to provide additional analysis not contained in the Objects, assigning Text/content to the Object the Note relates to Notes can be created by anyone (not just the original object creator).

        For example, an analyst may add a Note to a Campaign object created by another organization indicating that they''ve seen posts related to that Campaign on a hacker forum.'
      type: object
      properties:
        schema_version:
          type: string
        revision:
