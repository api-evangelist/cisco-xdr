aid: cisco-xdr
name: Cisco XDR
description: Cisco XDR is Cisco's extended detection and response platform, the successor to SecureX. It correlates
  telemetry from Cisco Secure Endpoint, Secure Firewall, Umbrella, Duo, Secure Email and third-party sources into
  incidents, and exposes REST APIs for incidents, investigations, response actions and threat intelligence, documented
  on Cisco DevNet. Cisco publishes an XDR MCP server alongside the REST surface. No anonymously fetchable OpenAPI
  document is published.
