aid: cisco-xdr
name: Cisco XDR
description: 'Cisco XDR is Cisco''s extended detection and response platform, the successor to SecureX. It correlates
  telemetry from Cisco Secure Endpoint, Secure Firewall, Umbrella, Duo, Secure Email and third-party sources into
  incidents, and exposes four distinct REST API families behind a single OAuth 2.0 authorization server: the IROH
  platform (inspect, enrich, response actions, integration modules, events, webhooks) at visibility.amp.cisco.com,
  the CTIA private-intelligence store at private.intel.amp.cisco.com, the Conure v2 incidents and investigations
  service at conure.us.security.cisco.com, and the Automation workflow engine at automate.us.security.cisco.com.
  All four publish anonymously fetchable machine-readable contracts — 52 documents, 581 operations, 1,176 schema
  definitions — and Cisco additionally ships a 27-tool MCP server through CiscoDevNet, stdio-only. There is no sandbox,
  no test mode and no idempotency key anywhere, including on the operation that blocks, isolates and quarantines.'
url: https://raw.githubusercontent.com/api-evangelist/cisco-xdr/refs/heads/main/apis.yml
type: Index
access: 3rd-Party
