aid: cisco-xdr
name: Cisco XDR
description: 'Cisco XDR is Cisco''s extended detection and response platform, the successor to SecureX. It correlates
  telemetry from Cisco Secure Endpoint, Secure Firewall, Umbrella, Duo, Secure Email and third-party sources into
  incidents, and exposes REST APIs for incidents, investigations, response actions and threat intelligence, documented
  on Cisco DevNet. Cisco publishes an XDR MCP server alongside the REST surface. Unlike most of Cisco''s estate,
  XDR does publish anonymously fetchable Swagger 2.0 documents: nine IROH service specifications at visibility.amp.cisco.com
  plus the CTIA threat-intelligence API, together 251 paths and 335 operations.'
url: https://raw.githubusercontent.com/api-evangelist/cisco-xdr/refs/heads/main/apis.yml
type: Index
access: 3rd-Party
position: Consumer
x-type: company
x-source: cisco-family-buildout:2026-08-19
x-parent: cisco
x-relationship: product
x-contract-status: real
x-contract-note: 'Cisco XDR publishes anonymously fetchable Swagger 2.0 at visibility.amp.cisco.com/iroh/<service>/swagger.json
  — nine IROH services plus the CTIA threat intelligence API at private.intel.amp.cisco.com/swagger.json. Ten documents,
  251 paths, 335 operations, harvested 2026-08-19 with x-provenance. The host returns real 404s on invented paths,
  so the 200s are genuine. This corrects an earlier ''none'' reading: the initial probe checked developer.cisco.com
  and the product page, not the IROH service hosts.'
