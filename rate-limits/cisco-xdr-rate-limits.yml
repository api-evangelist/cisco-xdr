limit_count: 5
limits:
- scope: per-organization (all API Clients in one org share the quota)
  window: rolling 60 minutes
  limit: 8000
  unit: requests
  applies_to: all Cisco XDR APIs (default)
- scope: per-organization
  window: rolling 60 minutes
  limit: 8000
  unit: calls
  applies_to: all Automation APIs except Workflow Run
- scope: per-organization
  window: 1 minute
  limit: 10
  unit: calls
  applies_to: Workflow Run API (/v1.1/workflows/start and /v1.1/ui/workflows/start)
- scope: per-organization
  window: 1 minute / 1 day
  limit: 10 per minute and 5000 per day
  unit: events
  applies_to: Event-based Automation Rules (Email, Webhook, Incident, Task)
- scope: per-organization
  window: 1 day
  limit: 10000
  unit: runs
  applies_to: Schedule-based Automation Rules
response:
  status_on_exhaustion: 429
  headers:
  - name: X-Ratelimit-Org-Limit
    meaning: the organization's ceiling for the window (e.g. 8000)
  - name: X-Ratelimit-Org-Remaining
    meaning: calls left in the window (0 at exhaustion)
  - name: Retry-After
    meaning: seconds to wait before retrying; documented example value "3172s"
  body: '{"message": "Too many requests"} on Conure; IROH returns the NormalizedError envelope'
