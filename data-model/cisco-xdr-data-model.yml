source: openapi/ (CTIA entity specs, iroh-int, iroh-webhook, Conure v2)
note: >-
  The Cisco XDR data model is CTIM — the Cisco Threat Intel Model, versioned independently of the
  API and exposed at runtime as the x-ctim-version response header (1.3.30 on 2026-08-19). CTIM is
  STIX-informed: the entity names are the STIX vocabulary, but the relationships are Cisco's own and
  are expressed through one reified Relationship entity rather than typed edges, which is why almost
  every association below is many-to-many through Relationship rather than a foreign key.
identity:
  id_format: 'transit://<host>/<entity>/<entity>-<uuid> style CTIA long ids; every entity is also addressable by external_id'
  external_id: 'Every CTIA entity accepts an external_id on create and is retrievable at /ctia/<entity>/external_id/{external_id} — the closest thing to a dedupe key the API offers.'
entities:
- name: Incident
  domain: response
  base: /ctia/incident
  detail: >-
    The centre of gravity. Also served, differently, by Conure v2 (/v2/incident) which is the
    high-priority incident search surface with its own document shape.
  operations: [create, read, update, patch, delete, search, count, link, status, metrics]
