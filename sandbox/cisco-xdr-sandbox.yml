note: >-
  Cisco XDR publishes no API sandbox, no test mode, and no fixture data. There is no test-vs-live
  key prefix, no simulated observable, and no way to exercise a response action (block, isolate,
  quarantine) without a licensed tenant and a real configured integration module. An API Client is
  created inside a production XDR tenant under Administration > API Clients, and everything it does
  is real. Combined with the absence of any idempotency key (see conventions/), that makes the
  response-trigger surface the sharpest edge in this API: an agent's retry is a second real-world
  containment action.
