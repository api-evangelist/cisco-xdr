note: >-
  Cisco names three Cisco XDR license tiers publicly but publishes no list price for any of them,
  and there is no self-serve checkout. Buying goes through a Cisco seller or partner, and the
  developer surface has no plan of its own — API access is a property of the tenant licence, not a
  separately priced product. Reseller catalogues quote figures; those are not Cisco-published and
  are deliberately not recorded here. The API rate limit (8000 requests/hour per organization) is
  the same across tiers as documented, so the tier changes what data exists to call, not how much
  you may call it.
