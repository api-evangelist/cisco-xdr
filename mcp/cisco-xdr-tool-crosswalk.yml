note: >-
  Binding is by HTTP method + path, not operationId, because Cisco XDR's Swagger 2.0 documents
  publish almost no operationIds — exactly one operation in the entire IROH/CTIA surface
  (findObservables on POST /iroh/iroh-inspect/inspect) carries one. The Automation API
  (OpenAPI 3.0.1) is the exception and does declare operationIds, so those rows name them.
  The MCP server is stdio-only and its live tools/list could not be introspected anonymously,
  so tool names and descriptions come from the provider's own INSTALL.md tables and the REST
  bindings come from the server's documented path map in that same file.
