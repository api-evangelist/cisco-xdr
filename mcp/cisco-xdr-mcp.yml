deployment:
  mode: local-stdio
  endpoint: null
  install: npm install && npm run build && npm start
  package: https://github.com/CiscoDevNet/xdr-mcp-community
  auth: oauth
  verified: searched
  note: >-
    Cisco ships NO hosted/remote MCP endpoint for XDR. The server is source-only in the CiscoDevNet
    GitHub organization — package.json declares name cisco-xdr-mcp v2.0.0 but registry.npmjs.org
    returns 404 for that name, so there is not even an npx one-liner. A human must clone, npm install,
    npm run build and run it over stdio (or build the shipped Dockerfile) before any agent can reach
    Cisco XDR. Auth is OAuth 2.0 client-credentials via XDR_CLIENT_ID / XDR_CLIENT_PASSWORD env vars
    against https://visibility.{region}.amp.cisco.com/iroh/oauth2/token.
server:
  name: cisco-xdr
  transport: stdio
  version: 2.1.0
  license: Apache-2.0
  language: TypeScript
  repository: https://github.com/CiscoDevNet/xdr-mcp-community
  repository_pushed_at: '2026-05-27'
  sdk: '@modelcontextprotocol/sdk ^1.0.4'
  regions: [us, eu, apjc]
  env:
  - name: XDR_CLIENT_ID
    required: true
  - name: XDR_CLIENT_PASSWORD
    required: true
  - name: XDR_REGION
    required: false
    default: us
  - name: XDR_CONURE_BASE_URL
    required: false
tools_list_probe:
  attempted: false
  reason: >-
    No hosted endpoint exists to POST tools/list to. The tool catalog below is transcribed verbatim
    from the provider's own INSTALL.md tool tables, not guessed; input schemas would require running
    the server locally with tenant credentials.
tools:
- name: xdr_inspect
  category: inspect
  description: Parse text to extract IOCs (IPs, domains, hashes, emails, etc.)
- name: xdr_investigate
  category: inspect
  description: Full enrichment — sightings + verdicts + pivot links across all integrations
- name: xdr_inspect_and_investigate
  category: inspect
  description: One-shot — extract IOCs from text, then investigate all in parallel
- name: xdr_incidents_list
  category: incidents
  description: List incidents with filters (status, limit, offset)
- name: xdr_incident_get
  category: incidents
  description: Get full incident details
- name: xdr_incident_update
  category: incidents
  description: Update status, assignee, resolution (uses PATCH)
- name: xdr_incident_worklog
  category: incidents
  description: Get worklog / audit trail
- name: xdr_incident_worklog_add
  category: incidents
  description: Add note to worklog
- name: xdr_incident_observables
  category: incidents
  description: List all observables in an incident
- name: xdr_response_get_actions
