note: >-
  Cisco ships no current, registry-published client library for the Cisco XDR API. The only
  first-party SDK on any public registry is the Python `threatresponse` module, published by Cisco
  Security for Threat Response — the product IROH became when it was rebranded SecureX and then
  Cisco XDR. Its last release is 0.15.0 from 2021-11-22, more than four years before this probe,
  against a platform whose own service specs are at version 1.0.107 and whose CTIA API is at
  v2.71.0. That is the abandonment signal: the SDK predates two rebrands of the API it wraps.
