format: vendor-json
note: >-
  Cisco XDR does NOT use RFC 9457 problem+json. It ships three different, mutually incompatible
  error envelopes across the four API families — an agent that learns one will mis-parse the other
  two. All three are plain application/json.
envelopes:
- id: iroh-normalized-error
  used_by: IROH platform services (auth, enrich, inspect, response, int, event, feedback, webhook)
  media_type: application/json
  shape:
    error: short machine token, e.g. invalid_request
    error_description: human sentence
    error_code: optional vendor code
    error_uri: optional link
    trace_id: correlation id echoed for support
  schema_ref: openapi/_original/cisco-xdr-iroh-enrich-openapi.json#/definitions/NormalizedError-401
  example:
    error: invalid_request
    error_description: No JWT found in HTTP Authorization header
- id: conure-message
  used_by: Conure v2 incidents and investigations API
  media_type: application/json
  shape:
    message: fixed enum string per status
    exception: optional exception class name (500 only)
    data: optional detail payload (500 only)
  schema_ref: openapi/cisco-xdr-incidents-investigations-openapi.json
- id: iroh-module-error
  used_by: Enrich / Response aggregate responses, per integration module
  media_type: application/json
  shape:
    module_instance_id: which configured module failed
    module_type_id: which integration type
    module_instance_state: state at failure
    code: vendor error code
    message: human message
    type: 'one of: fatal | warning | error'
  schema_ref: openapi/_original/cisco-xdr-iroh-enrich-openapi.json#/definitions/ErrorMessage
  note: >-
    Partial failure is normal here — a 200 from observe/deliberate/refer can carry per-module errors
    in the envelope while other modules succeeded. Agents MUST read the errors array on a 200.
