status_page_detail: >-
  Cisco XDR Service Status, named by Cisco's own help documentation at
  docs.xdr.security.cisco.com/Content/Help-Resources/td_r-status-page.htm. Filters by service zone
  and region and carries scheduled-maintenance notices. The page returns 200; its statuspage-style
  /api/v2/components.json is bot-blocked (403) to anonymous clients. Note that
  status.security.cisco.com is a DIFFERENT page — Security Cloud Control — whose eight components
  do not include XDR.
