  current: 'docs API version 1.1; CTIA v2.71.0; IROH build 1.0.107; Conure conure-218-1; Automation v1 / v1.1 / v1.2'
  docs: https://developer.cisco.com/docs/cisco-xdr/api-changelog/
  detail: >-
    Four families, four schemes. CTIA versions in info.version only. Conure versions in the path
    (/v1, /v2). Automation runs three concurrent path majors (/v1, /v1.1, /v1.2) whose operation
    coverage differs. IROH does not version its paths at all. The only runtime version signal is the
    x-iroh-api-version / x-ctim-version response header pair.
deprecation:
  policy_url: null
  sunset_header: false
  deprecation_header: false
  detail: >-
    No API deprecation policy is published. developer.cisco.com/docs/cisco-xdr/deprecation/ and
    /versioning/ both return 404. No operation in the 581 harvested operations carries
    deprecated: true, and no RFC 8594 Sunset or Deprecation header is declared anywhere. Cisco's
    corporate End-of-Life policy covers product SKUs (there is a published EoS/EoL notice for the
    XDR Essentials/Advantage/Premier regional-uplift PIDs) but says nothing about API contracts.
    Three live Automation majors with no stated removal date is the practical consequence.
